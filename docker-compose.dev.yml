version: '3.8'

services:
  opencode-server:
    image: ghcr.io/opencode-ai/opencode:latest
    container_name: opencode-server-dev
    ports:
      - "4096:4096"
    environment:
      - PORT=4096
      - OPENCODE_ENV=development
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4096/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - code-review-network

  webhook-server:
    build:
      context: .
      target: development
    container_name: webhook-server-dev
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      - PORT=8080
      - NODE_ENV=development
      - OPENCODE_API_URL=http://localhost:4096
    restart: unless-stopped
    volumes:
      - .:/app
      - /app/node_modules
      - /tmp/code-review:/tmp/code-review
    depends_on:
      opencode-server:
        condition: service_healthy
    command: npm run dev
    networks:
      - code-review-network

networks:
  code-review-network:
    driver: bridge
